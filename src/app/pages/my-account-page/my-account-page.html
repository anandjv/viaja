<app-page-banner [title]="`My Account`" />

<!-- My Account -->
<div class="my-account-area ptb-120">
    <div class="container mw-1345">
        <div class="authentication-wrap">
            <ul class="nav nav-tabs border-0 justify-content-center authentication-tab" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button [ngClass]="{'active': currentTab === 'tab1'}" class="nav-link bg-transparent border-0"
                        (click)="switchTab($event, 'tab1')" type="button">
                        Login
                    </button>
                </li>
                <!-- <li class="nav-item" role="presentation">
                    <button
                        [ngClass]="{'active': currentTab === 'tab2'}"
                        class="nav-link bg-transparent border-0"
                        (click)="switchTab($event, 'tab2')"
                        type="button"
                    >
                        Register
                    </button>
                </li> -->
            </ul>
            <div class="tab-content">
                @if (currentTab === 'tab1') {
                <div class="tab-pane fade show active">
                    <h3>Welcome to Inigo Travels</h3>
                    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
                        <div class="mb-3">
                            <label class="label">Username or email address</label>
                            <input type="text" class="form-control" placeholder="Enter username" name="username"
                                [(ngModel)]="loginData.username" required>
                        </div>
                        <div class="mb-3">
                            <label class="label">Password *</label>
                            <input type="password" class="form-control" name="password" [(ngModel)]="loginData.password"
                                required>
                        </div>
                        <button type="submit" class="default-btn w-100 mb-3">
                            Log In
                        </button>
                        <button type="submit"
                            class="default-btn bg-transparent w-100 text-secondary style-two mb-3">Continue with
                            Google</button>
                        <button type="submit" class="default-btn bg-transparent w-100 text-secondary">Continue with
                            Facebook</button>
                    </form>
                </div>
                }

        </div>
    </div>
</div>
