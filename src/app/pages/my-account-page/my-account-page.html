<app-page-banner
    [title]="`My Account`"
/>

<!-- My Account -->
<div class="my-account-area ptb-120">
    <div class="container mw-1345">
        <div class="authentication-wrap">
            <ul class="nav nav-tabs border-0 justify-content-center authentication-tab" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button
                        [ngClass]="{'active': currentTab === 'tab1'}"
                        class="nav-link bg-transparent border-0"
                        (click)="switchTab($event, 'tab1')"
                        type="button"
                    >
                        Login
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button
                        [ngClass]="{'active': currentTab === 'tab2'}"
                        class="nav-link bg-transparent border-0"
                        (click)="switchTab($event, 'tab2')"
                        type="button"
                    >
                        Register
                    </button>
                </li>
            </ul>
            <div class="tab-content">
                @if (currentTab === 'tab1') {
                    <div class="tab-pane fade show active">
                        <h3>Welcome to Viaja</h3>
                        <form>
                            <div class="mb-3">
                                <label class="label">Username or email address</label>
                                <input type="email" class="form-control" placeholder="Enter name or email">
                            </div>
                            <div class="mb-3">
                                <label class="label">Password *</label>
                                <input type="password" class="form-control" value="Password ">
                            </div>
                            <button type="submit" class="default-btn w-100 mb-3">Log In</button>
                            <a routerLink="/forgot-password" class="text-decoration-none mb-3 d-inline-block">Forgot password?</a>
                            <div class="or mb-3">
                                <span>Or</span>
                            </div>
                            <button type="submit" class="default-btn bg-transparent w-100 text-secondary style-two mb-3">Continue with Google</button>
                            <button type="submit" class="default-btn bg-transparent w-100 text-secondary">Continue with Facebook</button>
                        </form>
                    </div>
                }
                @if (currentTab === 'tab2') {
                    <div class="tab-pane fade show active">
                        <h3>Create an Account</h3>
                        <form>
                            <div class="mb-3">
                                <label class="label">Username*</label>
                                <input type="text" class="form-control" placeholder="Enter name or email">
                            </div>
                            <div class="mb-3">
                                <label class="label">Email*</label>
                                <input type="email" class="form-control" placeholder="Enter email address">
                            </div>
                            <div class="mb-3">
                                <label class="label">Password *</label>
                                <input type="password" class="form-control" value="Password ">
                            </div>
                            <div class="mb-4">
                                <label class="label">Password Confirm *</label>
                                <input type="password" class="form-control" value="Password ">
                            </div>
                            <button type="submit" class="default-btn w-100">Register</button>
                        </form>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
