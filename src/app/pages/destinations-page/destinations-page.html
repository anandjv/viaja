<app-page-banner
    [title]="`All Destinations`"
/>

<!-- Destinations -->
<div class="trending-destinations-area ptb-120">
    <div class="container mw-1345">
        <div class="mb-40 text-center">
            <h2 class="main-title">Top Adventure Destinations</h2>
            <p>Discover the world's most thrilling landscapes with our expert-curated selection</p>
        </div>
        <div class="row g-4 gy-42 justify-content-center">
            <div class="col-lg-4 col-md-6" *ngFor="let dest of destinations">
                <div class="trending-destinations-single-item">
                    <div class="trending-destinations-img position-relative z-1">
                        <a [routerLink]="getRoute(dest)" class="text-decoration-none d-block">
                            <img [src]="'https://www.inigotravels.com/bknd/uploads/' + dest.image" alt="{{ dest.title }}" />
                        </a>   
                        <a routerLink="." class="tag d-inline-block text-decoration-none">Trending</a>
                    </div> 
                    <div class="trending-destinations-content bg-fafafb">
                        <a [routerLink]="getRoute(dest)" class="title d-block text-decoration-none">
                            <h3>{{ dest.title }}</h3>
                        </a>
                        <a routerLink="/destination-details" class="read-more d-inline-block text-decoration-none">
                            <span>View All Tour</span>
                            <i class="ri-arrow-right-long-line"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
