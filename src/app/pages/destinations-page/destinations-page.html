<app-page-banner [title]="`All Destinations`" />

<!-- Destinations -->
<div class="trending-destinations-area ptb-120">
    <div class="container mw-1345">
        <div class="mb-40 text-center">
            <h2 class="main-title">Top Adventure Destinations</h2>
            <p>Discover the world's most thrilling landscapes with our expert-curated selection</p>
        </div>
        <div class="row g-4 gy-42 justify-content-center">
            <div class="col-lg-4 col-md-6" *ngFor="let dest of paginatedData; trackBy: trackByIndex">
                <div class="trending-destinations-single-item">
                    <div class="trending-destinations-img position-relative z-1">
                        <a [routerLink]="['/destination', dest.id]" class="text-decoration-none d-block">
                            <img [src]="'https://www.inigotravels.com/bknd/uploads/' + dest.image"
                                alt="{{ dest.title }}" />
                        </a>
                        <!-- ADMIN ACTIONS -->
                        <div *ngIf="authService.isAdmin()">

                            <a class="tag d-inline-block text-decoration-none" href="javascript:void(0)"
                                (click)="openEditModal(dest)">
                                Edit
                            </a>

                            <a class="tags d-inline-block text-decoration-none" href="javascript:void(0)"
                                style="color: white;" (click)="deleteDestination(dest.id)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                    class="bi bi-trash-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                                </svg>
                                &nbsp; Delete
                            </a>

                        </div>

                    </div>
                    <div class="trending-destinations-content bg-fafafb">
                        <a [routerLink]="['/destination', dest.id]" class="title d-block text-decoration-none">
                            <h3>{{ dest.title }}</h3>
                        </a>
                        <!-- <a routerLink="/destination-details" class="read-more d-inline-block text-decoration-none">
                            <span>View All Tour</span>
                            <i class="ri-arrow-right-long-line"></i>
                        </a> -->
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="pagination-area d-flex align-items-center justify-content-center">

                    <!-- PREV -->
                    <button class="next page-numbers border-0" (click)="prevPage()" [disabled]="currentPage === 1">
                        <i class="ri-arrow-left-long-line"></i>
                    </button>

                    <!-- PAGE NUMBERS -->
                    <button *ngFor="let p of [].constructor(totalPages); let i = index" class="page-numbers border-0"
                        [class.current]="currentPage === i + 1" (click)="setPage(i + 1)">
                        {{ i + 1 | number:'2.0' }}
                    </button>

                    <!-- NEXT -->
                    <button class="next page-numbers border-0" (click)="nextPage()"
                        [disabled]="currentPage === totalPages">
                        <i class="ri-arrow-right-long-line"></i>
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>
