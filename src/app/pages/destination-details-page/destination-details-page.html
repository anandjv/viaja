<app-page-banner [title]="`Kerala`" />

<!-- Destination Details -->
<div class="destination-details-area ptb-120">
    <div class="container mw-1345">
        <div class="position-relative mb-50">
            <div class="destination-slide">
                <owl-carousel-o [options]="destinationDetailsImageSlider">
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination10.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination11.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination12.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination10.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination11.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination12.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination10.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination11.jpg" alt="destination">
                        </div>
                    </ng-template>
                    <ng-template carouselSlide>
                        <div class="destination-details-item">
                            <img src="images/destination12.jpg" alt="destination">
                        </div>
                    </ng-template>
                </owl-carousel-o>
            </div>
        </div>
        <div class="destination-top-info">
            <h2>{{ destinations.sub_heading }}</h2>
            <p>Stand at the foot of the world's highest mountain on this legendary Himalayan adventure</p>
            <br>
        </div>
        <div class="row g-4" *ngIf="destinations">
            <div class="col-lg-8">
                <div class="destination-details-content">
                    <h3>Destination Overview</h3>
                    <p>{{ destinations.description }}</p>
                    <h3>Highlights</h3>
                    <ul class="p-0 m-0 list-unstyled">
                        <li class="d-flex align-items-start gap-10 mb-3" *ngFor="let item of highlightsArray">
                            <i class="ri-check-fill text-primary  mt-1"></i>
                            <p class="mb-0">{{ item }}</p>
                        </li>
                    </ul>

                </div>
            </div>
            <div class="col-lg-4">
                <div class="destination-map mb-4">
                    <h3>Location Map</h3>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4016727.033476322!2d73.49602153006171!3d10.533316397034037!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b0812ffd49cf55b%3A0x64bd90fbed387c99!2sKerala!5e0!3m2!1sen!2sin!4v1770039464297!5m2!1sen!2sin"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="career-form">
                    <h3>Book Your Tour</h3>
                    <app-booking-form></app-booking-form>
                </div>
            </div>
        </div>
    </div>
</div>
