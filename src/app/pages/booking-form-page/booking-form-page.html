<app-page-banner
    [title]="`Booking Form`"
/>

<!-- Booking Form -->
<div class="tour-booking-form-area ptb-120">
    <div class="container">
        <div class="tour-booking-form mx-auto">
            <div class="row gy-3">
                <div class="col-lg-6">
                    <div>
                        <label class="label">First name *</label>
                        <input type="text" class="form-control" placeholder="Enter first namel">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Last name *</label>
                        <input type="text" class="form-control" placeholder="Enter last name">
                    </div>
                </div>
                <div class="col-lg-12">
                    <div>
                        <label class="label">Email *</label>
                        <input type="email" class="form-control" placeholder="Enter email address">
                    </div>
                </div>
                <div class="col-lg-12">
                    <div>
                        <label class="label">Phone *</label>
                        <input type="number" class="form-control" placeholder="Enter phone number">
                    </div>
                </div>
                <div class="col-lg-12">
                    <h3>Your Booking</h3>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Departure country</label>
                        <select class="form-select form-control" aria-label="Default select example">
                            <option selected>Select country</option>
                            <option value="1">Spain</option>
                            <option value="2">Germany</option>
                            <option value="3">Denmark</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Destination country</label>
                        <select class="form-select form-control" aria-label="Default select example">
                            <option selected>Select country</option>
                            <option value="1">Spain</option>
                            <option value="2">Germany</option>
                            <option value="3">Denmark</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Departure date</label>
                        <input type="date" class="form-control">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Departure time</label>
                        <input type="time" class="form-control">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Return date</label>
                        <input type="date" class="form-control">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Return time</label>
                        <input type="time" class="form-control">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Number of passengers</label>
                        <select class="form-select form-control" aria-label="Default select example">
                            <option selected>1 person $100.00</option>
                            <option value="1">2 person $200.00</option>
                            <option value="2">3 person $2500.00</option>
                            <option value="3">4 person $300.00</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">ZIP code *</label>
                        <input type="code" class="form-control" placeholder="Enter zip code">
                    </div>
                </div>
                <div class="col-lg-12">
                    <span>Total to be paid via credit card: <span class="fw-bold">$100.00</span></span>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Stripe credit acrd *</label>
                        <input type="number" class="form-control" placeholder="Card number">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label class="label">Name of card</label>
                        <input type="text" class="form-control" placeholder="Enter namer">
                    </div>
                </div>
                <div class="col-lg-12">
                    <div>
                        <label class="label">Name of card</label>
                        <textarea rows="6" class="form-control" placeholder="Write additional message" id=""></textarea>
                    </div>
                </div>
                <div class="col-lg-12">
                    <button class="default-btn px-40" type="submit">
                        Submit Form
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
