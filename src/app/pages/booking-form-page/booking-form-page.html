<app-page-banner [title]="'Booking Form'" />

<div class="tour-booking-form-area ptb-120">
    <div class="container">
        <div class="tour-booking-form mx-auto">
            <form [formGroup]="bookingForm" (ngSubmit)="submit()">
                <div class="row gy-3">
                    <div class="col-lg-12">
                        <label class="label">First name *</label>
                        <input type="text" class="form-control" formControlName="name"
                            placeholder="Enter first name" />
                        <small class="text-danger"
                            *ngIf="bookingForm.get('name')?.touched && bookingForm.get('name')?.invalid">
                            First name is required
                        </small>
                    </div>

                    <div class="col-lg-12">
                        <label class="label">Email *</label>
                        <input type="email" class="form-control" formControlName="email"
                            placeholder="Enter email address" />
                        <small class="text-danger"
                            *ngIf="bookingForm.get('email')?.touched && bookingForm.get('email')?.invalid">
                            Valid email is required
                        </small>
                    </div>

                    <div class="col-lg-12">
                        <label class="label">Phone *</label>
                        <input type="text" class="form-control" formControlName="mobile"
                            placeholder="Enter phone number" />
                        <small class="text-danger"
                            *ngIf="bookingForm.get('mobile')?.touched && bookingForm.get('mobile')?.invalid">
                            Phone number is required
                        </small>
                    </div>

                    <div class="col-lg-12">
                        <label class="label">Message *</label>
                        <textarea rows="5" class="form-control" formControlName="message" placeholder="Write about yourself"></textarea>
                    
                        <small class="text-danger" *ngIf="
                          bookingForm.get('message')?.touched &&
                          bookingForm.get('message')?.invalid
                        ">
                            Message is required
                        </small>
                    </div>


                    <div class="col-lg-12">
                        <button class="default-btn px-40" type="submit" [disabled]="loading">
                            {{ loading ? 'Submitting...' : 'Submit Form' }}
                        </button>
                    </div>

                    <div class="col-lg-12">
                        <p class="text-success" *ngIf="successMessage">{{ successMessage }}</p>
                        <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
