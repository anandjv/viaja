<app-page-banner [title]="destination.title" />

<!-- Tour Details -->
<div class="tour-details-area ptb-120">
    <div class="container mw-1345">
        <div class="mb-50">
            <div class="row g-4 align-items-center">
                <div class="col-sm-3">
                    <div class="tour-details-img mb-4">
                        <img src="images/tour-details1.jpg" alt="Image">
                    </div>
                    <div class="tour-details-img">
                        <img src="images/tour-details2.jpg" alt="Image">
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="tour-details-img">
                        <img src="images/tour-details3.jpg" alt="Image">
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="tour-details-img mb-4">
                        <img src="images/tour-details4.jpg" alt="Image">
                    </div>
                    <div class="tour-details-img">
                        <img src="images/tour-details5.jpg" alt="Image">
                    </div>
                </div>
            </div>
        </div>
        <div class="destination-top-info">
            <h2>{{ destination.title }}</h2>
            <p>{{ destination.sub_heading }}</p>
        </div>
        <div class="row g-4 mt-1">
            <div class="col-lg-8">
                <div class="destination-details-content">
                    <h3>Tour Highlights</h3>
                       <ul class="p-0 m-0 list-unstyled">
                        <li class="d-flex align-items-start gap-10 mb-3" *ngFor="let item of highlightsArray">
                            <i class="ri-check-fill text-primary  mt-1"></i>
                            <p class="mb-0">{{ item }}</p>
                        </li>
                    </ul>
                    <br>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="destination-map mb-4">
                    <h3>Location Map</h3>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d201395.83539971776!2d-122.66964299461343!3d37.93487061904076!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808e49714015%3A0x3c2eecb4578be6c0!2sThe%20Clift%20Royal%20Sonesta%20San%20Francisco!5e0!3m2!1sen!2sbd!4v1758428203936!5m2!1sen!2sbd"></iframe>
                </div>
                <div class="career-form">
                    <h3>Book Your Tour</h3>
                   <app-booking-form></app-booking-form>
                </div>
            </div>
        </div>
    </div>
</div>
