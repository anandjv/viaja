<form class="information-form mx-auto" style="max-width: 1335px;">
    <div></div>
    <h3 class="db-title">Personal Information</h3>
    <div class="row g-4">
        <div class="col-lg-6">
            <label class="label">First name</label>
            <input type="text" class="form-control" value="Michael">
        </div>
        <div class="col-lg-6">
            <label class="label">Last name</label>
            <input type="text" class="form-control" value="Chen">
        </div>
        <div class="col-lg-6">
            <label class="label">Email address</label>
            <input type="email" class="form-control" value="Chen">
        </div>
        <div class="col-lg-6">
            <label class="label">Phone number</label>
            <input type="number" class="form-control" value="+1 (444) 753-8292">
        </div>
        <div class="col-lg-6">
            <label class="label">Date of birth</label>
            <input type="date" class="form-control">
        </div>
        <div class="col-lg-6">
            <label class="label">Nationality</label>
            <select class="form-select form-control" aria-label="Default select example">
                <option selected>United Stated</option>
                <option value="1">United Stated</option>
                <option value="2">United Kingdom</option>
                <option value="3">Canada</option>
            </select>
        </div>
        <div class="col-lg-6">
            <label class="label">Address</label>
            <input type="text" class="form-control" value="123 Main St, Apt 4B">
        </div>
        <div class="col-lg-6">
            <label class="label">City</label>
            <select class="form-select form-control" aria-label="Default select example">
                <option selected>Chicago</option>
                <option value="1">United Stated</option>
                <option value="2">United Kingdom</option>
                <option value="3">Canada</option>
            </select>
        </div>
        <div class="col-lg-6">
            <label class="label">ZIP/Postal code</label>
            <input type="number" class="form-control" value="17003">
        </div>
        <div class="col-lg-6">
            <label class="label">Passport number</label>
            <input type="text" class="form-control" value="CA357 985 78">
        </div>
        <div class="col-lg-12">
            <label class="label">Upload Profile Photo</label>
            <input type="file" class="form-control">
            <img src="images/destination1.jpg" class="img-thumbnail rounded-1 mt-2" style="width: 100px;" alt="user1">
        </div>
        <div class="col-lg-12">
            <label class="label">Describe Yourself</label>
            <textarea rows="5" class="form-control" placeholder="Write about yourself"></textarea>
        </div>
        <div class="col-lg-12">
            <div class="d-flex gap-10">
                <button type="submit" class="default-btn px-40">Cancel</button>
                <button type="submit" class="default-btn px-40 style-two">Save Changes</button>
            </div>
        </div>
    </div>
</form>
