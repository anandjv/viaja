<div class="item-quantity d-flex align-items-center justify-content-between">
    <button class="quantity-btn bg-transparent p-0 border-0" (click)="decrement()">
        <i class="ri-subtract-line"></i>
    </button>
    <input type="type" class="quantity-input border-0 p-0 text-center bg-transparent" [(ngModel)]="value">
    <button class="quantity-btn bg-transparent p-0 border-0" (click)="increment()">
        <i class="ri-add-line"></i>
    </button>
</div>
