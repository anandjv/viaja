<div
    class="fun-fact-area position-relative z-1"
    [class.pb-120]="router.url === '/'"
    [class.bg-gray]="router.url === '/'"
>
    <div class="container mw-1345">
        <div class="fun-fact-wrap">
            <div class="row align-items-center g-4 g-md-0">
                <div class="col-lg-3 col-sm-12">
                    <div class="fun-fact-info">
                        <div class="d-flex star justify-content-center">
                            <i class="ri-star-fill text-warning"></i>
                            <i class="ri-star-fill text-warning"></i>
                            <i class="ri-star-fill text-warning"></i>
                            <i class="ri-star-fill text-warning"></i>
                            <i class="ri-star-fill text-warning"></i>
                        </div>
                        <h2>4.9/5.0</h2>
                        <span> Average Rating</span>
                    </div>
                </div>
                <div class="col-lg-3 col-sm-4">
                    <div class="fun-fact-single-item">
                        <h2><span class="counters">18700</span>+</h2>
                        <p>Satisfied Customers Worldwide</p>
                    </div>
                </div>
                <div class="col-lg-3 col-sm-4">
                    <div class="fun-fact-single-item">
                        <h2><span class="counters">25000</span>+</h2>
                        <p>Successful trips organized by Viaja</p>
                    </div>
                </div>
                <div class="col-lg-3 col-sm-4">
                    <div class="fun-fact-single-item">
                        <h2><span class="counters">7</span>+ Years</h2>
                        <p>Experience in global travel planning</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <img src="images/fun-fact-shape.png" class="fun-fact-shape" alt="fun-fact-shape">
</div>
