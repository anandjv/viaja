<div
    class="banner-area-three position-relative z-1 bg-img"
    style="background-image: url(images/banner-bg2.jpg);"
>
    <div class="container mw-1680 position-relative">
        <div class="banner-content-three">
            <h2>Adventure Awaits  Where Will Viaja Take You?</h2>
            <p>Book guided trips to the world's most thrilling destinations.</p>
            <div class="banner-btn d-flex flex-wrap align-items-center gap-10 justify-content-center">
                <a routerLink="/tour-listing" class="default-btn px-40">
                    Explore Tours
                </a>
                <button type="button" class="default-btn style-two px-40" (click)="openPopup()">
                    Watch Adventure Video
                </button>
            </div>
        </div>
    </div>
    <div class="banner-slide position-relative ptb-120">
        <owl-carousel-o [options]="bannerSlider">
            <ng-template carouselSlide>
                <img src="images/banner-slide1.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide2.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide3.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide4.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide5.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide6.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide7.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide1.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide2.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide3.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide4.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide5.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide6.png" alt="banner-slide">
            </ng-template>
            <ng-template carouselSlide>
                <img src="images/banner-slide7.png" alt="banner-slide">
            </ng-template>
        </owl-carousel-o>
    </div>
    <div class="container mw-1345">
        <div class="book-form-caption-wrap m-0">
            <h3 class="book-form-title">
                Search Your Adventure Travel
            </h3>
            <div class="book-form-wrap style-three">
                <form class="row align-items-end g-3">
                    <div class="col-lg-10">
                        <div class="row g-3 g-10">
                            <!-- Destination -->
                            <div class="col-lg-4 col-sm-6">
                                <div class="d-flex align-items-center gap-8 mb-1">
                                    <i class="ri-map-pin-line text-warning"></i>
                                    <label class="label text-white">Destination</label>
                                </div>
                                <div class="position-relative">
                                    <select class="form-select form-control">
                                        <option selected>Destination</option>
                                        <option>Indonesia</option>
                                        <option>France</option>
                                        <option>Italy</option>
                                        <option>Thailand</option>
                                        <option>South Africa</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Tour Type -->
                            <div class="col-lg-4 col-sm-6">
                                <div class="d-flex align-items-center gap-8 mb-1">
                                    <i class="ri-walk-line text-warning"></i>
                                    <label class="label text-white">Activity</label>
                                </div>
                                <div class="position-relative">
                                    <select class="form-select form-control">
                                        <option selected>Tour Type</option>
                                        <option>Adventure</option>
                                        <option>Hiking</option>
                                        <option>City Tour</option>
                                        <option>Beach Tour</option>
                                        <option>Wildlife Safari</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Duration -->
                            <div class="col-lg-4 col-sm-12 col-md-6">
                                <div class="d-flex align-items-center gap-8 mb-1">
                                    <i class="ri-calendar-2-line text-warning"></i>
                                    <label class="label text-white">Duration</label>
                                </div>
                                <div class="position-relative">
                                    <select class="form-select form-control">
                                        <option selected>All Duration</option>
                                        <option value="1">1-3 Days</option>
                                        <option value="2">4-7 Days</option>
                                        <option value="3">8-14 Days</option>
                                        <option value="4">15+ Days</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-2">
                        <!-- Search Button -->
                        <button type="submit" class="default-btn style-two w-100">
                            <span class="d-flex align-items-center justify-content-center gap-10">
                                <i class="ri-search-line"></i>
                                <span>Find Adventures</span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Video Popup -->
@if (isOpen) {
    <div
        class="mfp-wrap mfp-close-btn-in mfp-auto-cursor mfp-fade mfp-ready"
        tabindex="-1"
    >
        <div class="mfp-container mfp-iframe-holder">
            <div class="mfp-content">
                <div class="mfp-iframe-scaler">
                    <button
                        (click)="closePopup()"
                        title="Close (Esc)"
                        type="button"
                        class="mfp-close"
                    >
                        ×
                    </button>
                    <iframe src="https://www.youtube.com/embed/u31qwQUeGuM" title="Placeholder video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
    <div class="mfp-bg mfp-fade mfp-ready"></div>
}
