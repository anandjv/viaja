<div class="banner-area-two position-relative z-1 bg-img" style="background-image: url(images/banner-bg-shape.png);">
    <div class="container mw-1680 position-relative">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="banner-img-two">
                    <div class="banner-img-two">
                        <video #videoPlayer autoplay muted loop playsinline (loadedmetadata)="onLoaded()">
                            <source [src]="videoPath" type="video/mp4" />
                        </video>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="banner-content-two text-center">
                    <h2>Travel Discover Live the Experience</h2>
                    <p style="color: black;">Travel is not just movement - it is a passion written in the soul. India is a land where every
                        journey tells a story.
                        Inigo Travels is here to turn your travel dreams into meaningful experiences</p>
                    <a routerLink="/booking-form" class="default-btn position-relative z-1">
                        Book a Tour
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
